name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  INTEGRATION_DIR: custom_components/amazon_thermostat
  ZIP_NAME: amazon_thermostat.zip

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp manifest version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" \
            '.version = $v' "$INTEGRATION_DIR/manifest.json" > manifest.tmp
          mv manifest.tmp "$INTEGRATION_DIR/manifest.json"

      - name: Build release zip
        run: |
          cd "$INTEGRATION_DIR"
          zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" . \
            -x '*.pyc' -x '__pycache__/*'

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
